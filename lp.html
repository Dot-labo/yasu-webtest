<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売上を、もっと本質的に。</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: white;
    color: #0f172a;
  }

  /* ── HERO ── */
  .lp-hero {
    background: #0f172a;
    padding: 100px 40px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .lp-hero::before {
    content: '';
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: #6c63ff;
    border-radius: 50%;
    opacity: 0.12;
    filter: blur(80px);
  }

  .lp-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #94a3b8;
    margin-bottom: 20px;
    position: relative;
  }

  .lp-h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 1.15;
    color: white;
    margin-bottom: 24px;
    position: relative;
  }

  .lp-h1 em {
    font-style: italic;
    color: #818cf8;
  }

  .lp-lead {
    font-size: 16px;
    line-height: 1.8;
    color: #94a3b8;
    max-width: 560px;
    margin: 0 auto 40px;
    position: relative;
  }

  .lp-cta {
    display: inline-block;
    padding: 18px 48px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    color: white;
    background: #6c63ff;
    cursor: pointer;
    border: none;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.3s;
    position: relative;
    letter-spacing: 0.03em;
  }

  .lp-cta:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px rgba(108, 99, 255, 0.4);
  }

  /* ── FEATURES ── */
  .lp-section {
    padding: 80px 40px;
    background: white;
    max-width: 1000px;
    margin: 0 auto;
  }

  .lp-section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: #0f172a;
    margin-bottom: 40px;
    text-align: center;
  }

  .lp-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  @media (max-width: 640px) {
    .lp-cards { grid-template-columns: 1fr; }
  }

  .lp-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 32px 24px;
    text-align: center;
    transition: all 0.2s;
  }

  .lp-card:hover {
    border-color: #818cf8;
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(108, 99, 255, 0.1);
  }

  .lp-card-icon { font-size: 36px; margin-bottom: 14px; }

  .lp-card-title {
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 8px;
  }

  .lp-card-desc {
    font-size: 13px;
    color: #64748b;
    line-height: 1.6;
  }

  /* ── FORM ── */
  .lp-form-section {
    padding: 80px 40px;
    background: #f8fafc;
  }

  .lp-form-inner {
    max-width: 520px;
    margin: 0 auto;
  }

  .lp-form-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: #0f172a;
    margin-bottom: 32px;
    text-align: center;
  }

  .lp-form input, .lp-form textarea {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 14px;
    margin-bottom: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    color: #0f172a;
    outline: none;
    transition: border-color 0.2s;
    background: white;
  }

  .lp-form input:focus, .lp-form textarea:focus {
    border-color: #6c63ff;
    box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
  }

  .lp-form textarea { min-height: 120px; resize: none; }

  .lp-form-btn {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    color: white;
    background: #6c63ff;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.3s;
  }

  .lp-form-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(108, 99, 255, 0.35);
  }

  /* ── FOOTER ── */
  .lp-footer {
    padding: 32px 40px;
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    background: #0f172a;
  }
</style>
</head>
<body>

<!-- HERO -->
<section class="lp-hero">
  <div class="lp-eyebrow">LP制作 × AI × 爆速デプロイ</div>
  <h1 class="lp-h1"><em>売上を、</em>もっと本質的に。</h1>
  <p class="lp-lead">LP制作の常識を変える。Claude CodeとCloudflare Pagesで、あなたのビジネスを次のステージへ。</p>
  <button class="lp-cta">今すぐ無料相談する</button>
</section>

<!-- FEATURES -->
<section>
  <div class="lp-section">
    <div class="lp-section-title">選ばれる3つの理由</div>
    <div class="lp-cards">
      <div class="lp-card">
        <div class="lp-card-icon">⚡</div>
        <div class="lp-card-title">爆速デプロイ</div>
        <div class="lp-card-desc">修正指示から本番反映まで数分。機会損失ゼロ。</div>
      </div>
      <div class="lp-card">
        <div class="lp-card-icon">🎯</div>
        <div class="lp-card-title">SEO最適化</div>
        <div class="lp-card-desc">Core Web Vitals対応で検索上位へ。静的配信で爆速表示。</div>
      </div>
      <div class="lp-card">
        <div class="lp-card-icon">✏️</div>
        <div class="lp-card-title">簡単編集</div>
        <div class="lp-card-desc">管理画面から文章を変えるだけ。コード不要。</div>
      </div>
    </div>
  </div>
</section>

<!-- FORM -->
<section class="lp-form-section">
  <div class="lp-form-inner">
    <div class="lp-form-title">まずはお気軽にご相談ください</div>
    <div class="lp-form">
      <input type="text" placeholder="お名前">
      <input type="email" placeholder="メールアドレス">
      <textarea placeholder="ご相談内容をお聞かせください"></textarea>
      <button class="lp-form-btn">無料相談を申し込む →</button>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="lp-footer">
  © 2025 LP Studio. All rights reserved.
</footer>

</body>
</html>
